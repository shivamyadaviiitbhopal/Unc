<div class="app">
  <aside class="sidebar">

      <button data-page="activity"><span class="ico">◷</span> My activity</button>

    </nav>

  </aside>
  <main class="main">
    <header class="topbar"><div><div class="eyebrow">UNIVERSITY NETWORK CONNECTION</div><h1 id="pageTitle">Campus dashboard</h1></div><div class="top-actions"><div class="role-switch" aria-label="Switch demo role"><button class="active" data-role="requester">Requester view</button><button data-role="runner">Runner view</button></div><div class="profile"><div class="avatar" id="profileAvatar">AS</div><div class="profile-text"><strong id="profileName">Aarav Sharma</strong><small id="profileSub">Requester · IIIT Bhopal</small></div></div></div></header>
    <div id="pageContent"></div>
  </main>

<div class="modal-backdrop" id="createModal" role="dialog" aria-modal="true" aria-labelledby="createTitle"><div class="modal"><div class="modal-head"><h2 id="createTitle">Send a campus request</h2><button class="close" data-close="createModal" aria-label="Close">×</button></div>
<form id="requestForm">
<div class="field"><label for="item">What do you need?</label><input id="item" maxlength="70" placeholder="e.g. Lab manual, notebook, charger" required></div>
<div class="form-row"><div class="field"><label for="pickup">Pick-up building</label><select id="pickup" required><option value="">Choose building</option><option>Academic Block</option><option>Hostel Block A</option><option>Hostel Block B</option><option>Library</option><option>Canteen</option><option>Admin Block</option><option>Sports Complex</option></select></div><div class="field"><label for="drop">Deliver to</label><select id="drop" required><option value="">Choose building</option><option>Academic Block</option><option>Hostel Block A</option><option>Hostel Block B</option><option>Library</option><option>Canteen</option><option>Admin Block</option><option>Sports Complex</option></select></div></div>
<div class="form-row"><div class="field"><label for="itemCost">Item cost / reimbursement (₹)</label><input id="itemCost" type="number" min="0" max="5000" value="0" required></div><div class="field"><label for="distanceFee">Proposed distance fee (₹)</label><input id="distanceFee" type="number" min="0" max="500" value="10" required></div></div>
<div class="field"><label for="when">Needed by</label><select id="when"><option>Within 30 minutes</option><option>Within 1 hour</option><option>Today</option></select></div>
<div class="field"><label for="notes">Instructions (optional)</label><textarea id="notes" rows="2" maxlength="240" placeholder="Pickup details or anything the runner should know"></textarea></div>
<div class="cost-summary" id="formSummary"><div class="cost-line"><span>Item cost / reimbursement</span><strong id="sumItem">₹0</strong><
